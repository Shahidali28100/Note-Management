openapi: 3.0.3
info:
  title: Note Taking Application API — AB-1005 delta
  version: "0.5.0"
  description: >
    AB-1005 extends the existing `GET /api/notes` operation (introduced in
    AB-1004) with client-driven pagination and sorting query parameters.
    The response envelope shape is unchanged. Tag filtering (FRS-NOTE-008)
    is out of scope for this delta — the Tags/NoteTags tables do not exist
    until AB-1006, which will extend this same operation again.
paths:
  /api/notes:
    get:
      operationId: listNotes
      summary: List the caller's active notes with pagination and sorting
      description: >
        Returns the authenticated caller's non-deleted notes using the
        standard list envelope. Accepts optional page, pageSize, sortBy,
        and sortDirection query parameters. When none are supplied,
        behavior is unchanged from AB-1004 (page 1, pageSize 20, sorted by
        updatedAt descending).
      tags: [notes]
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          description: >
            1-based page number. Defaults to 1. Must be a valid integer
            >= 1; otherwise the request is rejected with 400.
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          description: >
            Number of items per page. Defaults to 20, capped at 100. Must
            be a valid integer >= 1; a value that is non-integer or < 1
            is rejected with 400 (same rule as page). A valid integer
            above 100 is silently clamped to 100.
          schema:
            type: integer
            minimum: 1
            default: 20
            maximum: 100
        - name: sortBy
          in: query
          required: false
          description: >
            Sort field, restricted to an explicit allowlist. Defaults to
            updatedAt. A value outside the allowlist is rejected with 400.
          schema:
            type: string
            enum: [createdAt, updatedAt, title]
            default: updatedAt
        - name: sortDirection
          in: query
          required: false
          description: >
            Sort direction. Defaults to desc. A value outside asc/desc is
            rejected with 400.
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        "200":
          description: The caller's active notes for the requested page/sort
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoteListResponse'
        "400":
          description: >
            Invalid page (non-integer or < 1), invalid pageSize
            (non-integer or < 1), sortBy outside the allowlist, or
            sortDirection outside asc/desc.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        "401":
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

components:
  schemas:
    Note:
      type: object
      required: [id, title, content, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        content:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    NoteListResponse:
      type: object
      required: [items, page, pageSize, totalCount, totalPages]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Note'
        page:
          type: integer
          example: 1
        pageSize:
          type: integer
          example: 20
        totalCount:
          type: integer
        totalPages:
          type: integer

    ProblemDetails:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
